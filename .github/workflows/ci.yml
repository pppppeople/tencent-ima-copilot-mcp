name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m py_compile ima_server_simple.py query_ima.py src/*.py
      - run: python -c 'import ima_server_simple; assert ima_server_simple.mcp'
        env:
          IMA_X_IMA_COOKIE: test-cookie
          IMA_X_IMA_BKN: test-bkn
          IMA_KNOWLEDGE_BASE_ID: test-kb
