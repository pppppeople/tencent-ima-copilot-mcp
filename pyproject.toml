[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-ima-copilot-mcp"
version = "0.1.0"
description = "MCP server for Tencent IMA Copilot functionality"
authors = [
    {name = "IMA MCP Team", email = "team@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.11,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "jinja2>=3.1.4,<4",
    "aiohttp>=3.11,<4",
    "aiofiles>=24.1,<25",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.12,<1",
    "cryptography>=44,<47",
    "pydantic-settings>=2.6,<3",
    "websockets>=14,<16",
    "tenacity>=8,<10",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.0",
]

[project.scripts]
ima-mcp = "ima_server_simple:main"
ima-query = "query_ima:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.setuptools]
py-modules = ["ima_server_simple", "query_ima", "ima_auth_receiver", "update_cookie"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
